<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>升压与降压的图样</title><style>body{max-width:1080px;margin:40px auto;padding:0 24px;font:17px/1.8 system-ui,sans-serif;color:#243b46;background:#fafbf9}h1{font-size:32px;line-height:1.45}h2{font-size:23px;margin-top:38px}h3{font-size:19px}a{color:#086b79;text-underline-offset:4px}nav{display:flex;gap:20px;flex-wrap:wrap;font-size:15px}figure,details,.panel{margin:24px 0;padding:20px;background:white;border:1px solid #dce4de;border-radius:8px}figure img{display:block;max-width:100%;height:auto;margin:auto}figcaption{font-size:15px;color:#50646c;margin-top:12px}summary{cursor:pointer;font-weight:600}.muted{color:#60747b;font-size:15px}.buttons{display:flex;gap:14px;flex-wrap:wrap;margin:24px 0}.buttons a{display:inline-block;padding:8px 18px;border:1px solid #397b7d;border-radius:6px;text-decoration:none;background:white}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:9px 12px;border-bottom:1px solid #e0e6e2;text-align:left}.scroll{overflow-x:auto}code{background:#eef2ef;padding:2px 5px}pre{padding:16px;background:#eef2ef;overflow-x:auto;font-size:14px}.route{display:grid;grid-template-columns:46px 1fr;gap:4px 14px;margin:18px 0;padding:18px 0;border-bottom:1px solid #dce4de}.route b{font-size:25px;font-weight:500;color:#337878}.route h2{margin:0;font-size:21px}.route p{margin:3px 0;font-size:16px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.gallery figure{margin:0}.next{margin-top:38px;padding-top:20px;border-top:1px solid #cad8ce}footer{margin-top:36px;font-size:14px;color:#60747b}li{margin:6px 0}</style><h1>升压与降压的图样</h1><p>建立测量方法以后，先回到图像本身。这里按记录顺序排列实验3的升降压照片；显微扫描分时进行，用来观察结构变化。</p><h2>升压：二维点阵到横向峰列</h2><figure><a href="diffraction_up.png"><img loading="lazy" src="diffraction_up.png" alt="升压过程中，小二维点阵出现，随后与横向宽峰共存，再以横向峰列为主。高压下光斑展宽。"></a><figcaption>升压过程中，小二维点阵出现，随后与横向宽峰共存，再以横向峰列为主。高压下光斑展宽。</figcaption></figure><figure><a href="microscopy_up.png"><img loading="lazy" src="microscopy_up.png" alt="同一液晶盒的一次显微升压扫描：格纹与条纹分区共存，随后条纹占主导。显微照片与衍射照片不是同时拍摄。"></a><figcaption>同一液晶盒的一次显微升压扫描：格纹与条纹分区共存，随后条纹占主导。显微照片与衍射照片不是同时拍摄。</figcaption></figure><h2>降压没有重走同样的过程</h2><figure><a href="diffraction_down.png"><img loading="lazy" src="diffraction_down.png" alt="降压时可见横向峰列，但没有重现升压中的小二维点阵。相近电压不一定给出相同图样。"></a><figcaption>降压时可见横向峰列，但没有重现升压中的小二维点阵。相近电压不一定给出相同图样。</figcaption></figure><figure><a href="microscopy_down.png"><img loading="lazy" src="microscopy_down.png" alt="显微降压中先出现近均匀区域和稀疏折线，再出现较密条纹。"></a><figcaption>显微降压中先出现近均匀区域和稀疏折线，再出现较密条纹。</figcaption></figure><p>这提出了两个需要定量回答的问题：<b>各区域的周期有多大？各级光强的配比怎样变化？</b>扫描路径差异可以观察到；现有等待记录还不能独立确认稳态滞回。</p><details><summary>图像与实验记录</summary><a href="image_sequence.json">帧序列、电压和来源</a><p>本节重新生成图组，不声称进行了新测量。后续周期与模型计算使用各自明确的实验子集。</p></details></html>
